spring:
  application:
    name: homework-web-admin
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:home_work}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Singapore&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
    validate-on-migrate: true
    user: ${FLYWAY_DB_USERNAME:${DB_USERNAME:root}}
    password: ${FLYWAY_DB_PASSWORD:${DB_PASSWORD:123456}}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${ADMIN_SERVER_PORT:8081}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}

management:
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

admin:
  jwt:
    issuer: ${ADMIN_JWT_ISSUER:homework-admin}
    secret-key: ${ADMIN_JWT_SECRET_KEY:}
    ttl-seconds: ${ADMIN_JWT_TTL_SECONDS:7200}
  super-admin:
    email: ${ADMIN_SUPER_EMAIL:}
    password: ${ADMIN_SUPER_PASSWORD:}
    display-name: ${ADMIN_SUPER_DISPLAY_NAME:Super Admin}
  invitation:
    public-base-url: ${ADMIN_PUBLIC_BASE_URL:http://localhost:5174/admin/invitation}
  import-config:
    temp-directory: ${ADMIN_IMPORT_TEMP_DIR:${java.io.tmpdir}/homework-admin-imports}

tencent-cos:
  region: ${TENCENT_COS_REGION:}
  secret-id: ${TENCENT_COS_SECRET_ID:}
  secret-key: ${TENCENT_COS_SECRET_KEY:}
  bucket: ${TENCENT_COS_BUCKET:}
  read-url-ttl-seconds: ${TENCENT_COS_READ_URL_TTL_SECONDS:3600}

tencent-ses:
  enabled: ${TENCENT_SES_ENABLED:false}
  secret-id: ${TENCENT_SES_SECRET_ID:}
  secret-key: ${TENCENT_SES_SECRET_KEY:}
  region: ${TENCENT_SES_REGION:ap-hongkong}
  from-email: ${TENCENT_SES_FROM_EMAIL:}
  template-id: ${TENCENT_SES_TEMPLATE_ID:}
