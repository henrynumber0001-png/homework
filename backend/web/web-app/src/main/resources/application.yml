spring:
  application:
    name: homework-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:home_work}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Singapore&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false
  mapper-locations: classpath*:/mapper/**/*.xml

server:
  port: ${SERVER_PORT:8080}

tencent-cos:
  region: ${TENCENT_COS_REGION:}
  secret-id: ${TENCENT_COS_SECRET_ID:}
  secret-key: ${TENCENT_COS_SECRET_KEY:}
  bucket: ${TENCENT_COS_BUCKET:}
  read-url-ttl-seconds: ${TENCENT_COS_READ_URL_TTL_SECONDS:3600}

payment:
  wechat:
    # 本地开发和测试默认关闭；生产环境配置完整密钥后显式设置为 true。
    enabled: ${WECHAT_PAY_ENABLED:false}
    app-id: ${WECHAT_PAY_APP_ID:}
    merchant-id: ${WECHAT_PAY_MERCHANT_ID:}
    merchant-serial-number: ${WECHAT_PAY_MERCHANT_SERIAL_NUMBER:}
    merchant-private-key-path: ${WECHAT_PAY_MERCHANT_PRIVATE_KEY_PATH:}
    wechat-pay-public-key-id: ${WECHAT_PAY_PUBLIC_KEY_ID:}
    wechat-pay-public-key-path: ${WECHAT_PAY_PUBLIC_KEY_PATH:}
    api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
    notify-url: ${WECHAT_PAY_NOTIFY_URL:}
    zone-id: ${WECHAT_PAY_ZONE_ID:Asia/Shanghai}
    product-description: ${WECHAT_PAY_PRODUCT_DESCRIPTION:Homework会员订阅}


cloudflare:
  turnstile:
    secret-key: ${TURNSTILE_SECRET_KEY}
    siteverify-url: https://challenges.cloudflare.com/turnstile/v0/siteverify


jwt:
  issuer: com.homework
  secret-key: ${JWT_SECRET_KEY} #读取操作系统或 IDEA 运行配置中的 JWT_SECRET_KEY
  ttl-seconds: 36000
#不建议给生产密钥设置固定默认值
#终端环境变量和 IDEA 运行配置中的环境变量是两套启动环境。
#即使终端中为空，只要 IDEA 的 Environment variables 中设置了，使用 IDEA 启动时仍然可以正常读取。

oauth:
  google:
    enabled: ${GOOGLE_OAUTH_ENABLED:false}
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:}
    token-uri: https://oauth2.googleapis.com/token

  apple:
    enabled: ${APPLE_OAUTH_ENABLED:false}
    client-id: ${APPLE_CLIENT_ID:}
    team-id: ${APPLE_TEAM_ID:}
    key-id: ${APPLE_KEY_ID:}
    private-key: ${APPLE_PRIVATE_KEY:}
    redirect-uri: ${APPLE_REDIRECT_URI:}
    token-uri: https://appleid.apple.com/auth/token
    jwks-uri: https://appleid.apple.com/auth/keys

  wechat:
    enabled: ${WECHAT_OAUTH_ENABLED:false}
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
    redirect-uri: ${WECHAT_REDIRECT_URI:}
    scope: snsapi_login
    state-prefix: homework
    authorize-url: https://open.weixin.qq.com/connect/qrconnect
    access-token-url: https://api.weixin.qq.com/sns/oauth2/access_token
    user-info-url: https://api.weixin.qq.com/sns/userinfo
    lang: zh_CN

  qq:
    enabled: ${QQ_OAUTH_ENABLED:false}
    app-id: ${QQ_CONNECT_APP_ID:}
    app-key: ${QQ_CONNECT_APP_KEY:} #相当于其他平台里的 client-secret
    redirect-uri: ${QQ_CONNECT_REDIRECT_URI:}
    authorize-url: https://graph.qq.com/oauth2.0/authorize
    token-url: https://graph.qq.com/oauth2.0/token
    openid-url: https://graph.qq.com/oauth2.0/me
    user-info-url: https://graph.qq.com/user/get_user_info
    scope: get_user_info

llm:
  provider: ${LLM_PROVIDER:mock} # 本地没有设置时使用 Mock；生产设置为 qwen。
  base-url: ${LLM_BASE_URL:} # OpenAI 兼容接口 Base URL，不包含 /chat/completions。
  api-key: ${LLM_API_KEY:} # 只从环境变量读取，禁止设置默认密钥。
  model: ${LLM_MODEL:}
  connect-timeout: ${LLM_CONNECT_TIMEOUT:5s}
  read-timeout: ${LLM_READ_TIMEOUT:60s}
